# winget configure --file thinkpad.dsc.yaml
# Programas de la ThinkPad E14 Gen4 (Windows 11). Ya venían instalados: Brave, VS Code, Python 3.12, Node, Git, gh, Google Drive, Claude Code.
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
