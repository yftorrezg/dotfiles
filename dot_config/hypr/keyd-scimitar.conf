# keyd: remapeo SOLO para el mouse Corsair Scimitar RGB Elite (1b1c:1b8b).
# El mouse (memoria guardada desde Windows) manda estos atajos; aqui se convierten en
# F14..F24 y Hyprland (binds.lua, code:192..202) decide la accion.
# OJO: keyd NO admite comentarios en la misma linea que una regla.
# Instalar:  sudo cp ~/.config/hypr/keyd-scimitar.conf /etc/keyd/default.conf && sudo keyd reload
#
# Botones 1 (ALT+Derecha) y 4 (ALT+Izquierda) = adelante/atras: se dejan como vienen.
[ids]
1b1c:1b8b

[main]
# boton 8 (ENTER)
enter = f20
# boton 9 (SUPR)
delete = f21
# boton 11 (F11)
f11 = f23

# Capas de modificador: dentro de ellas el modificador se ignora, solo sale la tecla nueva.
[control]
# boton 2 (CTRL+C)
c = f14
# boton 5 (CTRL+V)
v = f17
# boton 10 (CTRL+W)
w = f22

[alt]
# boton 12 (ALT+F4)
f4 = f24

[shift]

[meta]

# Las capas compuestas van despues de las simples.
[control+meta]
# boton 3 (CTRL+WIN+Izq)
left = f15
# boton 6 (CTRL+WIN+Der)
right = f18

[control+shift]
# boton 7 (CTRL+SHIFT+Q)
q = f19
