# Ajustes de auto-captura (SUPER+ALT+S). Se leen al activarla.
INTERVALO=1        # segundos entre revisiones de pantalla
ESTABLE=2          # segundos quieta la pantalla = "línea terminada" -> guarda
TOPE=6             # si cambia sin parar, guarda igual cada N segundos
GRANDE=0.30        # 30% de la pantalla cambiada = scroll/otro archivo -> guarda el frame de antes
RUIDO=28           # subir si guarda capturas "iguales" (ruido del video); bajar si se pierde algo
MIN_PIXELES=6      # idem: más alto = menos sensible
MASCARA_ABAJO=0    # ej. 0.08 ignora la barra del reproductor (pero también las últimas líneas)
HISTORIAL=30       # no guarda si la pantalla es igual a una de las últimas N capturas (0 = apagado)
