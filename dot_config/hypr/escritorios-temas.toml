# escritorios-temas.toml — identidad de cada escritorio virtual (SUPER+1..5).
# La lee scripts/escritorios-vivos.py: al cambiar de escritorio pone su fondo
# (claro u oscuro según el modo de noctalia) y muestra el aviso flotante.
# Para cambiar algo: edita aquí y guarda; el programa lo recarga solo.
#   fondo_*      = monitor horizontal (DP-3, eDP-1)
#   vertical_*   = monitor girado (HDMI-A-1); si falta, usa fondo_*
#   video_*      = estilo "Animado" (solo monitor horizontal; el vertical queda con su fondo fijo)
#   El estilo "Aurora" usa Animados/Aurora/N-modo-h|v.mp4 (los crea scripts/generar-auroras.py)

[general]
por_monitor = 5          # NUM_WPM de variables.lua (ws 1-5 y 6-10)
aviso_segundos = 1.6     # cuánto dura el aviso en pantalla
aviso_activo = true      # false = solo cambia fondos, sin aviso
fondos_activos = true    # false = solo aviso, sin tocar fondos
carpeta = "~/Imágenes/Wallpapers"

