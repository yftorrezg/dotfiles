# temas-colecciones.toml — temas del selector (SUPER+SHIFT+A): un fondo distinto en cada escritorio.
# fondos = 5 videos, en orden: 1 Redes · 2 Entretenimiento · 3 Estudio · 4 Práctica · 5 Claude.
# Cada fondo es "Oscuros/<archivo sin .mp4>" o "Claros/<archivo sin .mp4>" de ~/Imágenes/Wallpapers/Temas.
# Si un video no existe (no está en este equipo o lo borraste), se repite otro de la misma colección.
# "Mi selección" no está aquí: la armas en el selector, pestaña Galería, con las teclas 1-5.

# ---------- Oscuros ----------
