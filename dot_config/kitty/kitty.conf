background_opacity          1.0
cursor_trail                1
window_padding_width        25

include themes/noctalia.conf

# Texto atenuado (comentarios/sugerencias) legible también en modo claro (18/10/2026)
dim_opacity 0.7

# --- Tipografía: JetBrains Mono, pensada para leer código mucho tiempo ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
# Más aire entre líneas: lo que más descansa la vista al leer
modify_font cell_height 112%

# --- Cursor: barra fina en vez de bloque ancho ---
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# --- Pestañas ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# --- Varias ventanas dentro de una pestaña (splits) ---
enabled_layouts splits,stack
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+alt+left        neighboring_window left
map ctrl+alt+right       neighboring_window right
map ctrl+alt+up          neighboring_window up
map ctrl+alt+down        neighboring_window down
map ctrl+shift+z         toggle_layout stack
