# ==========================================================
#  input.conf — atajos de teclado de mpv
#  Solo funcionan con la ventana de mpv enfocada. Ninguno usa SUPER,
#  así que no chocan con los atajos de Hyprland.
#  Guía completa: ~/.config/mpv/GUIA-MPV.md
#
#  Los atajos de velocidad, marcadores y curso están en sus scripts:
#    scripts/velocidad.lua   a d r q w g e v Retroceso
#    scripts/marcadores.lua  b n B Ctrl+b 1-9 Ctrl+1-9 Alt+1-9
#    scripts/bucle.lua       c Ctrl+c L
#    scripts/notas.lua       Ctrl+n h   (panel de notas al lado)
#    scripts/curso.lua       Alt+c Alt+C
# ==========================================================

# --- Pausa ---
SPACE        cycle pause
k            cycle pause
i            cycle pause
MBTN_LEFT     cycle pause                    # un clic en el video = pausa / play
MBTN_LEFT_DBL cycle fullscreen

# --- Adelantar / retroceder ---
RIGHT        seek   5                       # +5 s
LEFT         seek  -5                       # -5 s
Ctrl+RIGHT   seek  10                       # +10 s
Ctrl+LEFT    seek -10                       # -10 s
Alt+RIGHT    seek  30                       # +30 s
Alt+LEFT     seek -30                       # -30 s
Shift+RIGHT  ignore                         # desactivado (antes ±10 s; mpv trae ±1 s por defecto)
Shift+LEFT   ignore
z            seek  -5                       # como Video Speed Controller de Brave
x            seek   5
y            seek -10
u            seek  -5
o            seek   5
p            seek  10
[            seek -30
]            seek  30
}            ignore
{            ignore
l            seek  10                       # +10 s (como YouTube)
j            seek -10                       # -10 s (como YouTube)
.            frame-step                     # avanza un cuadro (con pausa)
,            frame-back-step                # retrocede un cuadro
HOME         seek 0 absolute                # al inicio del video
Ctrl+z       revert-seek                    # deshacer el último salto

# --- Volumen ---
UP           add volume  5
DOWN         add volume -5
WHEEL_UP     add volume  5
WHEEL_DOWN   add volume -5
m            cycle mute

# --- Lista de videos (carpeta / curso) ---
ENTER        playlist-next
N            playlist-next                  # siguiente video
P            playlist-prev                  # video anterior
>            playlist-next
<            playlist-prev
Tab          script-binding uosc/items      # ver la lista y elegir
Ctrl+o       script-binding uosc/open-file  # explorar carpetas y subcarpetas
MBTN_RIGHT   script-binding uosc/menu       # menú general
MENU         script-binding uosc/menu
C            script-binding uosc/chapters   # capítulos + tus marcas
PGUP         add chapter  1                 # siguiente capítulo / marca
PGDWN        add chapter -1                 # capítulo / marca anterior

# --- Pantalla ---
f            cycle fullscreen
ESC          set fullscreen no
Ctrl+i       script-binding stats/display-stats-toggle
t            show-progress                  # hora actual / tiempo que falta

# --- Repetir un fragmento (bucle): c, Ctrl+c y L están en scripts/bucle.lua ---

# --- Subtítulos ---
V            cycle sub-visibility
J            cycle sub

# --- Capturas ---
s            screenshot                     # guarda en ~/Imágenes/Capturas-mpv
S            screenshot video               # sin subtítulos

# --- Salir ---
Ctrl+q       quit-watch-later               # sale y recuerda el minuto
Ctrl+Q       quit                           # sale sin recordar (Ctrl+Shift+q)
Q            ignore                         # evita el Q de fábrica
