// /etc/logid.cfg
// Config para M720 Triathlon.
//
// Atras/Adelante (cid 0x53/0x56) NO se tocan, quedan con su funcion nativa.
//
// NOTA: la accion "Gestures" (4 direcciones en el boton del pulgar) tiene
// un bug conocido y sin arreglar en logiops para el M720 (cursor se
// congela, direcciones no se detectan):
// https://github.com/PixlOne/logiops/issues/450
// Por eso todos los botones de abajo se configuran como boton simple
// (un solo Keypress fijo), no como gestos direccionales.

log: {
  level: "info";
};

devices: (
  {
    name: "M720 Triathlon Multi-Device Mouse";

    smartshift: {
      on: true;
      threshold: 15;
    };

    buttons: (
      {
        // Boton de gestos (pulgar, cid 0xd0) -> Super+Shift+S
        // Las 4 direcciones no son viables: el firmware no reporta
        // movimiento (ni por evdev normal ni por el canal raw_xy que
        // logiops necesita) mientras este boton esta presionado.
        // Confirmado con /dev/input/event6 sin recibir un solo evento
        // durante el arrastre. Bug: https://github.com/PixlOne/logiops/issues/450
        cid: 0xd0;
        action = {
          type: "Keypress";
          keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_S"];
        };
      },
      {
        // Boton central / click de la rueda (cid 0x52) -> Ctrl+Shift+S
        // Ojo: esto reemplaza el click medio nativo (pegar seleccion X11,
        // abrir enlace en pestana nueva, cerrar pestana al hacer click medio).
        cid: 0x52;
        action = {
          type: "Keypress";
          keys: ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_S"];
        };
      },
      {
        // Tilt izquierdo (cid 0x5b) -> Ctrl+Shift+Tab (pestana anterior)
        cid: 0x5b;
        action = {
          type: "Keypress";
          keys: ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_TAB"];
        };
      },
      {
        // Tilt derecho (cid 0x5d) -> Ctrl+Tab (pestana siguiente)
        cid: 0x5d;
        action = {
          type: "Keypress";
          keys: ["KEY_LEFTCTRL", "KEY_TAB"];
        };
      }
    );
  }
);
