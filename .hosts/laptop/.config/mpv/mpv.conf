# ==========================================================
#  mpv.conf — configuración general del reproductor
#  Guía completa: ~/.config/mpv/GUIA-MPV.md
# ==========================================================

# --- Interfaz: la dibuja el script uosc, así que se apaga la de fábrica ---
osc=no
osd-bar=no
border=no

# --- Video / rendimiento (laptop: Intel Iris Xe, VA-API "iHD") ---
vo=gpu-next
# Decodificación por hardware: VA-API directo (H.264, HEVC, VP9 y AV1 en la Iris Xe, sin copiar
# el cuadro a la RAM = menos CPU y batería). Si un video no se puede, prueba lo seguro y si no, CPU.
hwdec=vaapi,auto-safe
# Calidad "normal" de gpu-next sin extras caros: nada de interpolación de movimiento ni debanding.
interpolation=no
deband=no
video-sync=audio


# --- Comportamiento ---
keep-open=yes            # al terminar el último video no se cierra la ventana
autofit-larger=90%x90%   # si el video es enorme, la ventana no tapa toda la pantalla
cursor-autohide=1000     # oculta el mouse al segundo de no moverlo

# --- Lista automática con los videos de la misma carpeta ---
# Al abrir un solo video, mpv carga el resto de la carpeta (en orden natural:
# 1, 2, 10… y no 1, 10, 2) para poder pasar al siguiente/anterior.
autocreate-playlist=filter
directory-filter-types=video
directory-mode=recursive # si abres una CARPETA, entra también en sus subcarpetas

# --- Recordar dónde te quedaste ---
save-position-on-quit=yes
watch-later-options=start,volume,mute,aid,sid

# --- Velocidad ---
# El audio conserva el tono al acelerar (no suena a ardilla).
audio-pitch-correction=yes

# --- Mensajes en pantalla ---
osd-duration=1200
osd-font-size=36
osd-bar-h=2

# --- Subtítulos: preferir español ---
slang=es,spa,es-419,en,eng
alang=es,spa,es-419,en,eng

# --- Capturas de pantalla (tecla s) ---
screenshot-dir=~/Imágenes/Capturas-mpv
screenshot-template="%F-%wH.%wM.%wS"
screenshot-format=png

# --- Batería ---
# scripts/bateria.lua aplica este perfil si la laptop está desenchufada (y lo saca al enchufarla).
# Escalado simple y sin filtros: para cursos (pantallas de código, diapositivas) no se nota.
[bateria]
profile-desc="Laptop con batería: render liviano"
profile-restore=copy
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
hdr-compute-peak=no
dither=no
