[accessibility]
ui_scale = 1.20

[bar.default]
auto_hide = true
center = [ "workspaces", "spacer_1", "active_window" ]
concave_edge_corners = true
end = [ "media", "spacer_1", "tray", "notifications", "modo", "network", "volume", "brightness", "battery", "session" ]
layer = "overlay"
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
reserve_space = false
scale = 1.10
start = [ "launcher", "gdrive", "clock", "spacer_1", "group:g1" ]
thickness = 35

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

# LAPTOP: el brillo de la interna va por backlight (brightnessctl). Se quitó ddcutil y el bloque
# [brightness.monitor.HDMI-A-1] de la PC (la Arzopa por HDMI se llama igual y heredaba ddcutil).
[brightness]
enable_ddcutil = false

# LAPTOP: inactividad. Noctalia ya hace el idle (no hace falta hypridle):
#  4:30 aviso con fundido -> 5 min bloquear -> 5:30 apagar pantalla -> 15 min suspender.
# Un video a pantalla (Brave/mpv) inhibe el idle solo. Cerrar la tapa suspende (logind) y
# Noctalia bloquea antes (lockscreen.lock_before_suspend, por defecto true).
[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]
pre_action_fade_seconds = 5.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 330

    [idle.behavior.suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900

# Desbloqueo con huella (lector Elan, fprintd). Noctalia habla con fprintd directamente;
# hay que registrar el dedo una vez: `fprintd-enroll` (y probar con `fprintd-verify`).
# La contraseña sigue funcionando siempre.
[lockscreen]
fingerprint = true
lock_before_suspend = true

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

# LAPTOP: sondeos menos frecuentes = menos despertares de CPU (batería)
[system.monitor]
cpu_poll_seconds = 3.0
gpu_poll_seconds = 10.0

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "alacritty" ]

    [theme.templates.user.qt-oscuro]
    input_path = "~/.config/noctalia/templates/qtct-oscuro.conf"
    output_path = [ "~/.config/qt5ct/colors/noctalia.conf", "~/.config/qt6ct/colors/noctalia.conf" ]

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.gdrive]
type = "custom_button"
glyph = "brand-google-drive"
tooltip = "Google Drive — clic: abrir carpeta, clic derecho: abrir en el navegador"

    [widget.gdrive.actions]
    left = "exec dolphin $HOME/GoogleDrive"
    right = "exec xdg-open https://drive.google.com"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = false

# LAPTOP: sin GPU dedicada -> temperatura del CPU (antes gpu_temp de la GTX 980)
[widget.sysmon_2]
glyph = "cpu-temperature"
show_value = false
stat = "cpu_temp"
type = "sysmon"

[widget.battery]
type = "battery"
display_mode = "graphic"
show_label = true
label_content = "percent"
hide_when_plugged = false
warning_color = "error"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false

[widget.modo]
type = "custom_button"
glyph = "sun-moon"
color = "secondary"
tooltip = "Modo claro / oscuro (SUPER+SHIFT+D)"

    [widget.modo.actions]
    left = "exec noctalia msg theme-mode-toggle"
